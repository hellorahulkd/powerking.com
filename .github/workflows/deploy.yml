name: Build & Deploy to GitHub Pages

# Every push to main rebuilds the site and publishes it.
# Adding a product = edit src/data/products.js, commit, push. That is the
# entire deployment process.
on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# Required for the deploy step to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# WHY A PUSH TO main MAY BUILD AND THEN NOT PUBLISH
#
# The deploy job below runs in the `github-pages` environment, and an
# environment can restrict which branches are allowed to deploy through it.
# On this repository that list did not include main: every push to main
# built fine and then failed the deploy job in about a second, before any
# step ran, while the identical workflow dispatched on a feature branch
# published normally. Measured both ways on 2026-09-07 to be sure it was the
# branch and not the event or the timing.
#
# That is a repository setting, not something this file can fix:
#   Settings → Environments → github-pages → Deployment branches and tags
# main has to be on that list (or the restriction removed) or nothing saved
# from /admin/ ever reaches the site — the commit lands, the build passes,
# and the published site stays as it was.
#
# One deployment at a time. Saving a product in /admin/ pushes twice, once
# for the photo and once for the catalogue, so runs do queue up; GitHub skips
# the ones queued in between and deploys the newest.
#
# cancel-in-progress stays false, which is what GitHub's own Pages
# configuration specifies: a deployment cancelled mid-flight can leave the
# next one to fail.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm install` — the build has zero dependencies on purpose, so
      # there is nothing to install, audit or break.
      - name: Build the site
        run: node build.js

      - name: Verify the build output
        run: node scripts/check.js

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
