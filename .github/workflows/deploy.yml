name: Build & Deploy to GitHub Pages

# Every push to main rebuilds the site and publishes it.
# Adding a product = edit src/data/products.js, commit, push. That is the
# entire deployment process.
on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:

# Required for the deploy step to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. When several pushes land close together — which
# is exactly what saving a product in /admin/ does, one commit for the photo
# and one for the catalogue — GitHub skips the runs queued in between and
# deploys the newest, so the site still ends up current.
#
# cancel-in-progress MUST stay false. It was true, and cancelling a Pages
# deployment mid-flight left the next one to fail on arrival: every save made
# from /admin/ between 00:08 and 00:25 built fine and then failed to publish,
# which is why photos uploaded from the admin showed as broken images — the
# files were in the repository, but the site serving them was never rebuilt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm install` — the build has zero dependencies on purpose, so
      # there is nothing to install, audit or break.
      - name: Build the site
        run: node build.js

      - name: Verify the build output
        run: node scripts/check.js

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
