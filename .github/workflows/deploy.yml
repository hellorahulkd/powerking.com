name: Build & Deploy to GitHub Pages

# Every push to the publishing branch rebuilds the site and publishes it.
# Saving a product in /admin/ is a push to that branch, so it is the whole
# deployment process.
on:
  push:
    # NOT main. See the note below — main cannot publish this repository.
    branches: [claude/powerking-nepal-website-tave3g]
  # Lets you re-deploy by hand from the Actions tab without pushing a commit.
  workflow_dispatch:
  # The public catalogue is pre-rendered, so an edit made in /admin/ reaches
  # the website on the next build. A push triggers one; this makes sure the
  # site is never more than a day behind even in a week when nobody pushes.
  # 01:15 UTC is about 07:00 in Kathmandu — before the shop opens.
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# WHY THE PUBLISHING BRANCH IS NOT main
#
# The deploy job runs in the `github-pages` environment, and an environment
# can restrict which branches may deploy through it. On this repository that
# list contains one branch, and it is not main. Every push to main built fine
# and then failed the deploy job in about a second, before any step ran, so
# the commit landed, the build passed, and the published site never changed —
# which is why photos saved from /admin/ showed as broken images for a day.
#
# Established by running the same commit and this same workflow from four
# refs on 2026-09-07:
#
#   claude/powerking-nepal-website-tave3g  → published
#   main                                   → deploy failed in 1s
#   live                                   → deploy failed in 1s
#   claude/live                            → deploy failed in 1s
#
# So it is not the event, not the timing, and not a wildcard on the prefix:
# that one branch is the only ref GitHub will publish from. The admin panel
# therefore commits there (src/config/site.config.js → repo.branch), and this
# workflow deploys from there. main is fast-forwarded to match afterwards, so
# it stays current without being in the publishing path.
#
# THE TIDIER ARRANGEMENT, WHEN SOMEONE CAN CHANGE THE SETTING:
#   Settings → Environments → github-pages → Deployment branches and tags
#   → add main (or remove the restriction)
# then set repo.branch back to 'main' and change the push trigger and the
# sync step below. Until then, this is what makes a save reach the site.
#
# One deployment at a time. Saving a product pushes twice, once for the photo
# and once for the catalogue, so runs do queue; GitHub skips the ones queued
# in between and deploys the newest. cancel-in-progress stays false, which is
# GitHub's own documented Pages configuration — a deployment cancelled
# mid-flight can leave the next one to fail.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm install` — the build has zero dependencies on purpose, so
      # there is nothing to install, audit or break.
      #
      # The two Supabase values are repository VARIABLES rather than secrets,
      # and that is the honest place for them: they are compiled into a public
      # website, so calling them secrets would make them harder to look at
      # rather than harder to obtain. The anon key identifies the project and
      # nothing more — Row Level Security decides what it may read. Secrets are
      # accepted too, for anyone who prefers them.
      #
      # With neither set the build still succeeds, reading the catalogue from
      # data/*.json. A site that cannot reach its database is still a site.
      - name: Build the site
        run: node build.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Verify the build output
        run: node scripts/check.js

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # main is the default branch and the one anybody browsing the repository
  # sees first, so it must not drift behind what is actually published. It
  # cannot be the branch that deploys, but it can be kept identical to it.
  #
  # A push made with GITHUB_TOKEN does not trigger workflows, so this cannot
  # loop back into another deploy. It is a fast-forward only: if main has
  # commits of its own it fails, and that is not worth failing the deploy
  # over, so the step reports and moves on.
  sync-main:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to what was just published
        continue-on-error: true
        run: |
          git push origin "${{ github.sha }}:refs/heads/main" \
            || echo "main has diverged; leaving it alone."
